openapi: 3.1.0
info:
  title: NEXUS SECURITY AI API
  version: 3.1.0
  description: Defensive, read-only review and security operations API. No target scanning or command execution.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      summary: Service health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                required: [status, version]
  /languages:
    get:
      operationId: listSupportedLanguages
      summary: List supported source-review languages
      security: []
      responses:
        '200':
          description: Supported language identifiers and file extensions
  /reviews/source:
    post:
      operationId: reviewSource
      summary: Perform heuristic static review of caller-supplied source text
      description: Source is inspected in memory only. It is never executed, stored, or echoed. Results are indicators, not proof.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, minLength: 1, maxLength: 100000 }
                language: { type: string, maxLength: 40 }
                filename: { type: string, maxLength: 180 }
              required: [code]
              additionalProperties: false
      responses:
        '200': { description: Heuristic source review result }
        '422': { description: Unsupported language or invalid input }
  /assets:
    get:
      operationId: listAssets
      summary: List assets visible to the authenticated user
      responses:
        '200':
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asset' }
    post:
      operationId: createAsset
      summary: Register an owned or administered asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '201': { description: Asset created }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Not authorized }
  /evidence:
    post:
      operationId: submitEvidence
      summary: Submit a sanitized evidence record for review
      description: Authentication material and secrets must be redacted before submission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceInput' }
      responses:
        '201': { description: Evidence accepted for review }
        '400': { description: Invalid or unsafe input }
        '413': { description: Payload too large }
  /reviews/logs:
    post:
      operationId: reviewLogs
      summary: Run deterministic analysis on supplied log text
      description: Processes supplied text only; does not connect to hosts or external services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evidence_id: { type: string, format: uuid }
              required: [evidence_id]
      responses:
        '202': { description: Review queued }
        '401': { description: Authentication required }
  /incidents:
    get:
      operationId: listIncidents
      summary: List incidents
      responses:
        '200': { description: Incident list }
    post:
      operationId: createIncident
      summary: Create an incident record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentInput' }
      responses:
        '201': { description: Incident created }
  /approvals:
    get:
      operationId: listApprovals
      summary: List approval requests visible to the user
      responses:
        '200': { description: Approval queue }
  /approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      summary: Approve or reject a permitted administrative request
      parameters:
        - in: path
          name: approvalId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string, minLength: 4, maxLength: 1000 }
              required: [decision, reason]
      responses:
        '200': { description: Decision recorded }
        '403': { description: Approver permission required }
        '409': { description: Self-approval or invalid state }
components:
  schemas:
    AssetInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        type: { type: string, enum: [application, server, database, endpoint, device, network, other] }
        environment: { type: string, enum: [production, staging, internal, personal] }
        criticality: { type: string, enum: [low, medium, high, critical] }
        owner: { type: string, maxLength: 160 }
      required: [name, type, environment, criticality]
      additionalProperties: false
    Asset:
      allOf:
        - $ref: '#/components/schemas/AssetInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
          required: [id, created_at]
    EvidenceInput:
      type: object
      properties:
        source_type: { type: string, enum: [log_sample, configuration_snapshot, policy_document, manual_note] }
        source_label: { type: string, maxLength: 160 }
        content: { type: string, maxLength: 200000 }
        redacted: { type: boolean, const: true }
      required: [source_type, source_label, content, redacted]
      additionalProperties: false
    IncidentInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 180 }
        description: { type: string, maxLength: 4000 }
        severity: { type: string, enum: [low, medium, high, critical] }
      required: [title, severity]
      additionalProperties: false
